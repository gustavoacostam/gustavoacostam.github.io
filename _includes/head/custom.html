<script>
  (function () {
    var theme = "dark";

    try {
      if (window.localStorage.getItem("site-theme") === "light") {
        theme = "light";
      }
    } catch (error) {}

    document.documentElement.setAttribute("data-theme", theme);
  }());
</script>
<meta name="theme-color" content="#111416">
